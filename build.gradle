plugins {
    // Javaビルド
    id 'java'

    // Spring Boot
    id 'org.springframework.boot' version '3.5.9'

    // 依存関係管理
    id 'io.spring.dependency-management' version '1.1.6'
}

// プロジェクト情報
group = 'com.news'
version = '0.1.0-SNAPSHOT'

// Actuator の '/actuator/info' で表示するビルド情報を生成
springBoot {
    buildInfo()
}

// Javaバージョン
def javaVersion = 21

java {
    toolchain {
        // Java 21を使用
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

// 依存ライブラリの取得先
repositories {
    // Maven Centralからライブラリを取得する
    mavenCentral()
}

// 使用するライブラリ
dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // OpenAPI / Swagger UI
    implementation('org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.17') {
        // 脆弱な依存を除外
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // Resilience
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

    // Metrics
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JSON / CSV
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.apache.commons:commons-csv:1.11.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // ONNX
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.23.2'

    // 依存バージョン固定（脆弱性対策）
    constraints {
        implementation('org.apache.commons:commons-lang3:3.18.0') {
            because 'CVE対策'
        }
    }

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Testcontainers
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:testcontainers'
}

// 追加テスト用のソースセット
sourceSets {
    integrationTest {
        java {
            // 結合試験のJavaソース配置先
            srcDir 'src/integrationTest/java'
        }
        resources {
            // 結合試験のリソース配置先
            srcDir 'src/integrationTest/resources'
        }

        // mainの出力とtestのコンパイル依存関係を結合試験でも利用
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath

        // mainの実行時クラスパスとtestの実行時依存関係を結合試験でも利用
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
    }

    systemTest {
        java {
            // 総合試験のJavaソース配置先
            srcDir 'src/systemTest/java'
        }
        resources {
            // 総合試験のリソース配置先
            srcDir 'src/systemTest/resources'
        }

        // mainの出力とtestのコンパイル依存関係を総合試験でも利用
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath

        // mainの実行時クラスパスとtestの実行時依存関係を総合試験でも利用
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath + configurations.testRuntimeClasspath
    }
}

// 追加テスト用の依存関係設定
configurations {
    // 結合試験でもtestImplementation / testRuntimeOnlyの依存関係を利用する
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly

    // 総合試験でもtestImplementation / testRuntimeOnlyの依存関係を利用する
    systemTestImplementation.extendsFrom testImplementation
    systemTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// 単体試験タスク
tasks.named('test') {
    // JUnit5
    useJUnitPlatform()
}

// 結合試験タスク
tasks.register('integrationTest', Test) {
    // タスク説明
    description = '結合試験'

    // グループに表示
    group = '結合試験'

    // 結合試験用クラスを実行対象にする
    testClassesDirs = sourceSets.integrationTest.output.classesDirs

    // 結合試験用クラスパスを使用する
    classpath = sourceSets.integrationTest.runtimeClasspath

    // 結合試験用プロファイルを指定
    systemProperty 'spring.profiles.active', 'integration'

    // JUnit5
    useJUnitPlatform()

    // 単体試験の後に実行する
    shouldRunAfter tasks.named('test')
}

// 総合試験タスク
tasks.register('systemTest', Test) {
    // タスク説明
    description = '総合試験'

    // グループに表示
    group = '総合試験'

    // 総合試験用クラスを実行対象にする
    testClassesDirs = sourceSets.systemTest.output.classesDirs

    // 総合試験用クラスパスを使用する
    classpath = sourceSets.systemTest.runtimeClasspath

    // JUnit5
    useJUnitPlatform()

    // 結合試験の後に実行する
    shouldRunAfter tasks.named('integrationTest')
}

// check実行時に結合試験、総合試験も実行する
tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('systemTest')
}

// Javaコンパイル時の文字コードをUTF-8に固定
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

// テスト実行時の標準出力・標準エラーの文字コードをUTF-8に固定
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'

    jvmArgs '-Dfile.encoding=UTF-8',
            '-Dsun.stdout.encoding=UTF-8',
            '-Dsun.stderr.encoding=UTF-8'
}