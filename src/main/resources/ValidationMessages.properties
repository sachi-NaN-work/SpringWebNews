# =========================
# 環境変数用メッセージ定義
# =========================
config.kafka.bootstrap.required=KAFKA_BOOTSTRAP_SERVERS は必須です（環境変数 KAFKA_BOOTSTRAP_SERVERS を設定するか、spring.kafka.bootstrap-servers を設定してください）
config.r2dbc.url.required=R2DBC_URL は必須です（環境変数 R2DBC_URL を設定するか、spring.r2dbc.url を設定してください）
config.r2dbc.username.required=POSTGRES_USER は必須です（環境変数 POSTGRES_USER を設定するか、spring.r2dbc.username を設定してください）
config.r2dbc.password.required=POSTGRES_PASSWORD は必須です（環境変数 POSTGRES_PASSWORD を設定するか、spring.r2dbc.password を設定してください）
config.redis.host.required=spring.data.redis.host は必須です
config.redis.port.required=REDIS_PORT は必須です（環境変数 REDIS_PORT を設定するか、spring.data.redis.port を設定してください）
config.server.port.required=SERVER_PORT は必須です（環境変数 SERVER_PORT を設定するか、server.port を設定してください）
