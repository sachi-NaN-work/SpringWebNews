<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!-- head 要素 -->
  <head>
    <!-- 文字コードを指定（UTF-8） -->
    <meta charset="utf-8" />
    <!-- viewport を設定（画面の幅を「端末の実際の幅」に合わせる・初期表示のズーム倍率を100%） -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 外部 CSS を読み込む（@{/css/site.css}） -->
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    <!-- 外部 CSS を読み込む（@{/css/mypage/admin_user_enabled.css}） -->
    <link rel="stylesheet" th:href="@{/css/mypage/admin_user_enabled.css}" />
    <!-- タイトル -->
    <title th:text="#{ui.title.007}">Spring Web News - Admin</title>
    <!-- アイコンを読み込む -->
    <th:block th:replace="~{fragments/icon :: icon}"></th:block>
  </head>
  <!-- body 要素 -->
  <body>
    <!-- 共通フラグメント読込（~{fragments/header :: siteHeader}） -->
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <!-- レイアウト用コンテナ -->
    <div class="wrap">
      <!-- グリッドレイアウト -->
      <div class="grid">
        <!-- 成功メッセージを表示 -->
        <div th:if="${msg != null}" class="msg" th:text="${msg}"></div>

        <!-- エラーメッセージを表示 -->
        <div th:if="${err != null}" class="err" th:text="${err}"></div>

        <!-- メインカード -->
        <section class="card">
          <!-- 見出し -->
          <h1 class="title" th:text="#{user.enabled.h1}">
            ユーザーの有効/無効化変更（USER_MGR：ユーザー管理ロール）
          </h1>

          <!-- 一覧テーブル -->
          <table>
            <!-- テーブル構造 -->
            <thead>
              <tr>
                <th th:text="#{user.enabled.th.username}">ユーザーID</th>
                <th th:text="#{user.enabled.th.role}">ロール</th>
                <th style="width: 120px" th:text="#{user.enabled.th.status}">状態</th>
                <th style="width: 140px" th:text="#{user.enabled.th.action}">操作</th>
              </tr>
            </thead>
            <!-- テーブル本体 -->
            <tbody>
              <!-- 繰り返し表示行 -->
              <tr th:each="appUser : ${users}">
                <td th:text="${appUser.username}">user</td>
                <td th:text="${appUser.role}">USER</td>
                <td>
                  <!-- 有効状態に応じて表示クラスを切り替え -->
                  <span
                    class="pill"
                    th:classappend="${appUser.enabled} ? ' pill-ok' : ''"
                    th:text="${appUser.enabled} ? #{common.enabled} : #{common.disabled}"
                  >
                    有効</span>
                </td>
                <td>
                  <!-- フォーム -->
                  <form
                    method="post"
                    th:action="@{/mypage/admin/user/enabled}"
                    th:if="${#strings.toUpperCase(appUser.role) != 'ADMIN' and not #strings.contains(#strings.toLowerCase(appUser.username), 'demo')}"
                  >
                    <!-- 入力欄（ユーザーID） -->
                    <input type="hidden" name="username" th:value="${appUser.username}" />
                    <!-- 入力欄（name=enabled） -->
                    <input type="hidden" name="enabled" th:value="${!appUser.enabled}" />
                    <!-- 操作ボタン -->
                    <button
                      class="btn"
                      th:classappend="${!appUser.enabled} ? ' btn-ok' : ''"
                      type="submit"
                      th:text="${appUser.enabled} ? #{user.enabled.button.disable} : #{user.enabled.button.enable}"
                    >
                      切替
                    </button>
                  </form>

                  <!-- 警告メッセージ表示領域 -->
                  <span
                    th:if="${#strings.toUpperCase(appUser.role) == 'ADMIN' or #strings.contains(#strings.toLowerCase(appUser.username), 'demo')}"
                    class="warn"
                    style="display:inline-block; padding:2px 8px; border-radius:999px;"
                    th:text="#{ui.mypage_admin_user_enabled.001}"
                  >
                    固定</span>
                </td>
              </tr>
            </tbody>
          </table>

          <div style="margin-top: 12px">
            <!-- リンク -->
            <a
              class="btn"
              th:href="@{/mypage}"
              style="text-decoration: none"
              th:text="#{common.back_to_mypage}"
            >
              各機能ページ一覧へ戻る
            </a>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
