<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!-- head 要素 -->
  <head>
    <!-- 文字コードを指定（UTF-8） -->
    <meta charset="utf-8" />
    <!-- viewport を設定（画面の幅を「端末の実際の幅」に合わせる・初期表示のズーム倍率を100%） -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 外部 CSS を読み込む（@{/css/site.css}） -->
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    <!-- 外部 CSS を読み込む（@{/css/mypage/admin_user_create.css}） -->
    <link rel="stylesheet" th:href="@{/css/mypage/admin_user_create.css}" />
    <!-- タイトル -->
    <title th:text="#{ui.title.007}">Spring Web News - Admin</title>
    <!-- アイコンを読み込む -->
    <th:block th:replace="~{fragments/icon :: icon}"></th:block>
  </head>
  <!-- body 要素 -->
  <body>
    <!-- 共通フラグメント読込（~{fragments/header :: siteHeader}） -->
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <!-- レイアウト用コンテナ -->
    <div class="wrap">
      <!-- グリッドレイアウト -->
      <div class="grid">
        <!-- 成功メッセージを表示 -->
        <div th:if="${msg != null}" class="msg" th:text="${msg}"></div>

        <!-- エラーメッセージを表示 -->
        <div th:if="${err != null}" class="err" th:text="${err}"></div>

        <!-- メインカード -->
        <section class="card">
          <!-- 見出し -->
          <h1 class="title" th:text="#{user.create.h1}">
            ユーザーの新規追加（USER_MGR：ユーザー管理ロール）
          </h1>

          <!-- フォーム（送信先: @{/mypage/admin/user/create}） -->
          <form method="post" th:action="@{/mypage/admin/user/create}">
            <div class="row">
              <!-- 入力ラベル -->
              <label th:text="#{user.create.label.username}">ユーザーID</label>
              <div>
                <!-- 入力欄（ユーザーID） -->
                <input type="text" name="username" pattern="[A-Za-z0-9]+" required />
                <div class="small username-policy" th:text="#{username.policy}">
                  ※ ユーザーIDは半角英数字で入力してください
                </div>
              </div>
            </div>

            <div class="row">
              <!-- 入力ラベル -->
              <label th:text="#{user.create.label.password}">パスワード</label>
              <div>
                <!-- 入力欄（パスワード） -->
                <input type="password" name="password" required />
                <div class="small password-policy" th:text="#{password.policy}">
                  ※ パスワードは最低8文字以上、大文字/小文字/数字をそれぞれ1文字以上含めてください
                </div>
              </div>
            </div>

            <div class="row">
              <!-- 入力ラベル -->
              <label th:text="#{user.create.label.password_confirm}">パスワード（確認）</label>
              <div>
                <!-- 入力欄（パスワード（確認）） -->
                <input type="password" name="confirmPassword" required />
                <div class="small password_confirm-policy" th:text="#{password_confirm.policy}">
                  ※ パスワード（確認）はパスワードと同様の入力をしてください
                </div>
              </div>
            </div>

            <div class="row">
              <!-- 入力ラベル -->
              <label th:text="#{user.create.label.role}">ロール</label>
              <!-- ロール（選択入力欄） -->
              <select name="role" required>
                <option value="" th:text="#{ui.mypage_admin_news_article_create.005}">-- 選択してください --</option>
                <!-- 選択肢を1件ずつ表示 -->
                <option
                        th:each="roleOption : ${roles}"
                        th:value="${roleOption.code}"
                        th:text="${roleOption.display()}"
                >
                  USER：一般ユーザーロール</option>
              </select>
            </div>

            <div class="row">
              <!-- 入力ラベル -->
              <label th:text="#{user.create.label.enabled}">アカウントの有効/無効</label>
              <!-- 有効/無効（選択入力欄） -->
              <select name="enabled" required>
                <option value="true" th:text="#{common.enabled}">有効</option>
                <option value="false" th:text="#{common.disabled}">無効</option>
              </select>
            </div>

            <div style="margin-top: 12px">
              <!-- 送信ボタン -->
              <button class="btn" type="submit" th:text="#{user.create.button.create}">作成</button>
              <!-- リンク -->
              <a
                class="btn"
                th:href="@{/mypage}"
                style="text-decoration: none; margin-left: 8px"
                th:text="#{common.back_to_mypage}"
              >
                各機能ページ一覧へ戻る</a>
            </div>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
