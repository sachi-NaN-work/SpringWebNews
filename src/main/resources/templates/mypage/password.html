<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!-- head 要素 -->
  <head>
    <!-- 文字コードを指定（UTF-8） -->
    <meta charset="utf-8" />
    <!-- viewport を設定（画面の幅を「端末の実際の幅」に合わせる・初期表示のズーム倍率を100%） -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 外部 CSS を読み込む（@{/css/site.css}） -->
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    <!-- 外部 CSS を読み込む（@{/css/mypage/password.css}） -->
    <link rel="stylesheet" th:href="@{/css/mypage/password.css}" />
    <!-- タイトル -->
    <title th:text="#{ui.title.005}">Spring Web News - Password</title>
    <!-- アイコンを読み込む -->
    <th:block th:replace="~{fragments/icon :: icon}"></th:block>
  </head>
  <!-- body 要素 -->
  <body>
    <!-- 共通フラグメント読込（~{fragments/header :: siteHeader}） -->
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <!-- レイアウト用コンテナ -->
    <div class="wrap">
      <!-- グリッドレイアウト -->
      <div class="grid">
        <!-- 成功メッセージを表示 -->
        <div th:if="${msg != null}" class="msg" th:text="${msg}"></div>

        <!-- エラーメッセージを表示 -->
        <div th:if="${err != null}" class="err" th:text="${err}"></div>

        <!-- メインカード -->
        <section class="card">
          <!-- 見出し -->
          <h1 class="title" th:text="#{password.h1}">パスワード変更</h1>

          <!-- フォーム（送信先: @{/mypage/password}） -->
          <form method="post" th:action="@{/mypage/password}">

            <div class="row">
              <!-- 入力ラベル -->
              <div class="small" th:text="#{password.label.current}">
                現在のパスワード
              </div>
              <div>
                <!-- 入力欄（現在のパスワード） -->
                <label>
                  <input type="password" name="currentPassword" required />
                </label>
              </div>
            </div>

            <div class="row">
              <!-- 入力ラベル -->
              <div class="small" th:text="#{password.label.new}">
                新しいパスワード
              </div>
              <div>
                <!-- 入力欄（パスワード） -->
                <label>
                  <input type="password" name="newPassword" required />
                </label>
                <div class="small password-policy" th:text="#{password.policy}">
                  ※ パスワードは最低8文字以上、大文字/小文字/数字をそれぞれ1文字以上含めてください
                </div>
              </div>
            </div>

            <div class="row">
              <!-- 入力ラベル -->
              <div class="small" th:text="#{password.label.new_confirm}">
                新しいパスワード（確認）
              </div>
              <div>
                <!-- 入力欄（パスワード） -->
                <label>
                  <input type="password" name="confirmPassword" required />
                </label>
                <div class="small password_confirm-policy" th:text="#{password_confirm.policy}">
                  ※ パスワード（確認）はパスワードと同様の入力をしてください
                </div>
              </div>
            </div>

            <div style="margin-top: 12px">
              <!-- 送信ボタン -->
              <button class="btn" type="submit" th:text="#{password.button.change}">変更</button>
              <!-- リンク -->
              <a
                class="btn"
                th:href="@{/mypage}"
                style="text-decoration: none; margin-left: 8px"
                th:text="#{common.back_to_mypage}"
              >
                各機能ページ一覧へ戻る</a>
            </div>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
