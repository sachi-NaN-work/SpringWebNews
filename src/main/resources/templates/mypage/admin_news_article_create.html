<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!-- head 要素 -->
  <head>
    <!-- 文字コードを指定（UTF-8） -->
    <meta charset="utf-8" />
    <!-- viewport を設定（画面の幅を「端末の実際の幅」に合わせる・初期表示のズーム倍率を100%） -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 外部 CSS を読み込む（@{/css/site.css}） -->
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    <!-- 外部 CSS を読み込む（@{/css/mypage/admin_news_article_create.css}） -->
    <link rel="stylesheet" th:href="@{/css/mypage/admin_news_article_create.css}" />
    <!-- 外部 CSS を読み込む（@{/css/hashtag_picker.css}） -->
    <link rel="stylesheet" th:href="@{/css/hashtag_picker.css}" />
    <!-- 外部 JS を読み込む（@{/js/hashtag_picker.js}） -->
    <script th:src="@{/js/hashtag_picker.js}" defer></script>
    <!-- タイトル -->
    <title th:text="#{ui.title.007}">Spring Web News - Admin</title>
    <!-- アイコンを読み込む -->
    <th:block th:replace="~{fragments/icon :: icon}"></th:block>
  </head>
  <!-- body 要素 -->
  <body>
    <!-- 共通フラグメント読込（~{fragments/header :: siteHeader}） -->
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <!-- レイアウト用コンテナ -->
    <div class="wrap">
      <!-- グリッドレイアウト -->
      <div class="grid">
        <!-- 成功メッセージを表示 -->
        <div th:if="${msg != null}" class="msg" th:text="${msg}"></div>
        <!-- エラーメッセージを表示 -->
        <div th:if="${err != null}" class="err" th:text="${err}"></div>

        <!-- 警告メッセージ表示領域 -->
        <div th:if="${#lists.size(categories) == 0}" class="warn" th:text="#{ui.mypage_admin_news_article_create.002}">
          有効なカテゴリがありません。先に「ニュース/カテゴリの作成」または「ニュース/カテゴリの有効・無効切替」で有効化してください。
        </div>

        <!-- メインカード -->
        <section class="card">
          <!-- 見出し -->
          <h1 class="title" th:text="#{mypage.menu.news.article.create}">ニュース/記事の作成（NEWS_MGR：ニュース管理ロール）</h1>

          <!-- フォーム -->
          <form
            id="createArticleForm"
            method="post"
            th:action="@{/mypage/admin/news/article/create}"
          >
            <!-- 条件付き表示 -->
            <div th:if="${#lists.size(categories) == 1}">
              <!-- 入力ラベル -->
              <label th:text="#{ui.mypage_admin_news_article_create.003}">カテゴリ</label>
              <div>
                <!-- 動的テキスト表示 -->
                <span th:text="${categories[0].name}"></span>
                <span class="mono" th:text="' (' + ${categories[0].slug} + ')'"></span>
              </div>
              <!-- 入力欄 -->
              <input
                type="hidden"
                name="categoryId"
                id="categoryIdHidden"
                th:value="${categories[0].id}"
              />
            </div>

            <!-- 複数カテゴリ時のみ表示する入力欄 -->
            <div th:if="${#lists.size(categories) >= 2}">
              <!-- 入力ラベル -->
              <label th:text="#{ui.mypage_admin_news_article_create.004}">カテゴリ</label>
              <!-- 選択入力欄 -->
              <select id="categoryIdSelect" name="categoryId" required>
                <option value="" th:text="#{ui.mypage_admin_news_article_create.005}">-- 選択してください --</option>
                <!-- 選択肢を1件ずつ表示 -->
                <option
                  th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name + ' (' + category.slug + ')'}"
                >
                </option>
              </select>
            </div>

            <!-- 入力ラベル -->
            <label th:text="#{ui.mypage_admin_news_article_create.006}">見出し</label>
            <!-- 入力欄（タイトル） -->
            <input type="text" name="title" placeholder="例：本日のニュース" maxlength="20" required th:attr="placeholder=#{ui.mypage_admin_news_article_create.010}" />

            <!-- 入力ラベル -->
            <label th:text="#{ui.mypage_admin_news_article_create.007}">記事内容</label>
            <!-- 複数行入力欄（本文） -->
            <textarea name="body" placeholder="本文を入力してください" required th:attr="placeholder=#{ui.mypage_admin_news_article_create.011}"></textarea>

            <!-- ハッシュタグ（最大5件まで選択：未登録は不可） -->
            <label th:text="#{news.hashtag.ui.label.max5}">ハッシュタグ（最大５件まで選択可）</label>
            <!-- 補足メッセージ -->
            <div class="small" style="margin-bottom: 6px" th:text="#{ui.mypage_admin_news_article_create.008}">
              ※ 未登録のハッシュタグは選択できません。事前に「ハッシュタグ一覧（マスタ）登録」で登録してください。
            </div>
            <!-- ハッシュタグ検索領域 -->
            <div class="tag-search">
              <!-- テキスト入力欄 -->
              <input
                id="hashtagSearch"
                type="text"
                th:placeholder="#{news.hashtag.ui.search.placeholder}"
                placeholder="ハッシュタグを検索"
                autocomplete="off"
                th:disabled="${hashtags == null or #lists.isEmpty(hashtags)}" th:attr="placeholder=#{news.hashtag.ui.search.placeholder}"
              />
            </div>
            <div id="hashtagTooManyMsg" style="display:none" th:text="#{news.hashtag.err.too_many(5)}">ハッシュタグは最大5件まで選択できます。</div>
            <!-- JS側でも “最低1件” を説明できるよう、文言は messages.properties から渡す -->
            <div id="hashtagRequiredMsg" style="display:none" th:text="#{news.hashtag.err.required(1)}">ハッシュタグを最低1件選択してください。</div>
            <div id="hashtagPickError" class="err" style="display:none"></div>

            <!-- 選択可能なハッシュタグ一覧 -->
            <div
              id="hashtagList"
              class="tag-list"
              th:if="${hashtags != null and !#lists.isEmpty(hashtags)}"
            >
              <!-- 入力ラベル -->
              <label class="tag-row" th:each="hashtag : ${hashtags}" th:attr="data-name=${hashtag.name}">
                <!-- チェックボックス -->
                <input type="checkbox" name="hashtagIds" th:value="${hashtag.id}" />
                <span th:text="${'#' + hashtag.name}"></span>
              </label>
            </div>
            <!-- ハッシュタグが未登録の場合のメッセージ -->
            <div class="small" th:if="${hashtags == null or #lists.isEmpty(hashtags)}" th:text="#{ui.mypage_admin_news_article_create.009}">（有効なハッシュタグがありません）</div>

            <div class="row">
              <!-- 操作ボタン -->
              <button
                type="submit"
                th:class="'btn btn-ok' + (${#lists.size(categories) == 0} ? ' btn-disabled' : '')"
                th:disabled="${#lists.size(categories) == 0}"
                th:text="#{user.create.button.create}"
              >
                作成
              </button>
              <!-- リンク（遷移先: @{/mypage}） -->
              <a class="btn" th:href="@{/mypage}" style="text-decoration: none" th:text="#{common.back_to_mypage}">各機能ページ一覧へ戻る</a>
              <span class="small">
                ※ 作成後は「ニュース/記事の有効・無効切替」から公開状態を変更できます。</span>
            </div>
          </form>
        </section>
      </div>
    </div>

  </body>
</html>
