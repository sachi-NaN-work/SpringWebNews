<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!-- head 要素 -->
  <head>
    <!-- 文字コードを指定（UTF-8） -->
    <meta charset="utf-8" />
    <!-- viewport を設定（画面の幅を「端末の実際の幅」に合わせる・初期表示のズーム倍率を100%） -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 外部 CSS を読み込む（@{/css/site.css}） -->
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    <!-- 外部 CSS を読み込む（@{/css/mypage/admin_news_article_disable.css}） -->
    <link rel="stylesheet" th:href="@{/css/mypage/admin_news_article_disable.css}" />
    <!-- タイトル -->
    <title th:text="#{ui.title.007}">Spring Web News - Admin</title>
    <!-- アイコンを読み込む -->
    <th:block th:replace="~{fragments/icon :: icon}"></th:block>
  </head>
  <!-- body 要素 -->
  <body>
    <!-- 共通フラグメント読込（~{fragments/header :: siteHeader}） -->
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <!-- レイアウト用コンテナ -->
    <div class="wrap">
      <!-- 成功メッセージを表示 -->
      <div th:if="${msg != null}" class="msg" th:text="${msg}"></div>
      <!-- エラーメッセージを表示 -->
      <div th:if="${err != null}" class="err" th:text="${err}"></div>

      <!-- メインカード -->
      <section class="card">
        <!-- 見出し -->
        <h1 class="title" th:text="#{mypage.menu.news.article.disable}">ニュース/記事の有効・無効切替（NEWS_MGR：ニュース管理ロール）</h1>

        <!-- 対象データがない場合のメッセージ -->
        <div th:if="${#lists.size(rows) == 0}" class="small" th:text="#{ui.mypage_admin_news_article_disable.002}">記事がありません。</div>

        <!-- 一覧テーブル -->
        <table th:if="${#lists.size(rows) > 0}">
          <!-- テーブル構造 -->
          <thead>
            <tr>
              <th th:text="#{ui.mypage_admin_news_article_disable.003}">公開日時</th>
              <th th:text="#{ui.mypage_admin_news_article_disable.004}">カテゴリ名</th>
              <th th:text="#{ui.mypage_admin_news_article_disable.005}">見出し</th>
              <th th:text="#{mypage.label.status}">状態</th>
              <th th:text="#{user.role.th.action}">操作</th>
            </tr>
          </thead>
          <!-- テーブル本体 -->
          <tbody>
            <!-- 繰り返し表示行 -->
            <tr th:each="row : ${rows}">
              <td th:text="${row.publishedAt}">2025-01-01 00:00:00</td>
              <td th:text="${row.categoryName}">カテゴリ</td>
              <td th:text="${row.title}">見出し</td>
              <td>
                <!-- 条件付き表示 -->
                <span th:if="${row.enabled}" class="badge badge-on" th:text="#{common.enabled}">有効</span>
                <span th:if="${!row.enabled}" class="badge badge-off" th:text="#{common.disabled}">無効</span>
              </td>
              <td>
                <!-- フォーム -->
                <form
                  th:action="@{/mypage/admin/news/article/disable/{id}(id=${row.id})}"
                  method="post"
                  style="display: inline"
                >
                  <!-- 入力欄 -->
                  <input
                    type="hidden"
                    th:if="${_csrf != null}"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                  />
                  <!-- 操作ボタン -->
                  <button
                    type="submit"
                    th:class="${row.enabled} ? 'btn' : 'btn btn-on'"
                    th:text="${row.enabled} ? '無効にする' : '有効にする'"
                  >
                    切替
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="row">
          <!-- リンク（遷移先: @{/mypage}） -->
          <a class="btn link" th:href="@{/mypage}" th:text="#{common.back_to_mypage}">各機能ページ一覧へ戻る</a>
        </div>
      </section>
    </div>
  </body>
</html>
