<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <!-- head 要素 -->
  <head>
    <!-- 文字コードを指定（UTF-8） -->
    <meta charset="utf-8" />
    <!-- viewport を設定（画面の幅を「端末の実際の幅」に合わせる・初期表示のズーム倍率を100%） -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 外部 CSS を読み込む（@{/css/site.css}） -->
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    <!-- 外部 CSS を読み込む（@{/css/news.css}） -->
    <link rel="stylesheet" th:href="@{/css/news.css}" />
    <!-- 外部 JS を読み込む（@{/js/feedback.js}） -->
    <script th:src="@{/js/feedback.js}" defer></script>
    <!-- 外部 JS を読み込む（@{/js/reactions.js}） -->
    <script th:src="@{/js/reactions.js}" defer></script>
    <!-- 外部 JS を読み込む（@{/js/favorites.js}） -->
    <script th:src="@{/js/favorites.js}" defer></script>
    <!-- 外部 JS を読み込む（@{/js/news_view.js}） -->
    <script th:src="@{/js/news_view.js}" defer></script>
    <!-- タイトル -->
    <title th:text="#{ui.title.003}">Spring Web News - News</title>
    <!-- アイコンを読み込む -->
    <th:block th:replace="~{fragments/icon :: icon}"></th:block>
  </head>

  <!-- body 要素 -->
  <body>
    <!-- 共通フラグメント読込（~{fragments/header :: siteHeader}） -->
    <div th:replace="~{fragments/header :: siteHeader}"></div>
    <!-- レイアウト用コンテナ -->
    <div class="layout">
      <!-- 共通サイドバー読み込み -->
      <div
        th:replace="~{fragments/sidebar :: leftMenu(categories=${categories}, selectedCategory=${selectedCategory}, favorites=${favorites}, categoryNameById=${categoryNameById})}"
      >
      </div>

      <!-- 中央コンテンツ領域 -->
      <main class="main-center"
        th:attr="data-news-id=${news.id},
        data-view-ms=${@recProperties.rtRec.viewMs}"
      >
        <!-- カテゴリ付きのタイトル -->
        <div class="section-title-row"
             th:with="displayTitle=${categoryNameById[news.categoryId.toString()] != null ? '【' + categoryNameById[news.categoryId.toString()] + '】' + news.title : news.title}"
        >
          <!-- 操作ボタン -->
          <button
            id="favBtn"
            type="button"
            class="fav-btn"
            th:classappend="${isFavorite} ? ' is-fav' : ''"
            th:attr="aria-pressed=${isFavorite},
                      data-news-id=${news.id},
                      data-title=${news.title},
                      data-category-id=${news.categoryId},
                      data-category-name=${categoryNameById[news.categoryId.toString()]}, aria-label=#{ui.news.002}"
            aria-label="お気に入り"
          >
            <!-- 動的テキスト表示 -->
            <span id="favIcon" class="fav-icon" th:text="${isFavorite} ? '★' : '☆'">☆</span>
          </button>
          <!-- 見出し -->
          <h1 class="section-title" th:text="${displayTitle}">title</h1>
        </div>
        <div class="body" th:text="${news.body}">
          body
        </div>

        <!-- 枠の最下部に表示 -->
        <div class="bottom-area">

          <!-- ハッシュタグ -->
          <div class="hashtags"
            th:if="${news.hashtags != null and !#lists.isEmpty(news.hashtags)}"
          >
            <!-- ハッシュタグを1件ずつ表示 -->
            <span class="hashtag" th:each="hashtag : ${news.hashtags}">
              <!-- 画面遷移リンク -->
              <a th:href="@{|/?hashtag=${hashtag.name}|}" th:text="${'#' + hashtag.name}"></a>
            </span>
          </div>

          <!-- good/bad -->
          <!--
              good/bad は片方のみ有効（同時ONなし）。
              bad 有効時に good を押す / good 有効時に bad を押すことで切替可能。
              再表示時は DB に保存した状態（userReaction）で背景色を復元する。
          -->
          <div class="reactions"
            th:attr="data-user-reaction=${userReaction}"
          >

            <!-- good ボタン -->
            <button class="reaction-btn"
              type="button"
              data-feedback-type="good"
              th:classappend="${userReaction == 'good'} ? ' selected' : ''"
              th:disabled="${isLoggedIn == false}"
            >
              ◯ good
            </button>

            <!-- bad ボタン -->
            <button class="reaction-btn"
              type="button"
              data-feedback-type="bad"
              th:classappend="${userReaction == 'bad'} ? ' selected' : ''"
              th:disabled="${isLoggedIn == false}"
            >
              × bad
            </button>

            <span class="small" style="margin-left: 8px"></span>
          </div>
        </div>

      </main>

      <!-- サイド領域 -->
      <aside class="main-right">
        <!-- マイページ導線 -->
        <div class="mypage-nav">
          <!-- リンク（遷移先: @{/mypage}） -->
          <a class="btn-link" th:href="@{/mypage}" th:text="#{mypage.h1}">マイページ</a>
        </div>
        <!-- 区切り線 -->
        <div class="right-divider"></div>

        <!-- セクション見出し -->
        <h2 th:text="#{ui.news.001}">リアルタイム推薦</h2>
        <!-- 推薦表示の補足情報 -->
        <div class="rec-note" th:text="#{ui.index.003}">（デモサイトのため、推薦値等を表示しています。）</div>
        <!-- リスト表示 -->
        <ul>

          <!-- カテゴリ付きタイトル -->
          <li class="rec-item" th:each="recommendedNews : ${rec}"
              th:with="recCategoryName=${recommendedNews.categoryId != null ? categoryNameById[recommendedNews.categoryId.toString()] : null},
                recDisplayTitle=${recCategoryName != null ? '【' + recCategoryName + '】' + recommendedNews.title : recommendedNews.title}"
          >

            <!-- リンク（遷移先: @{|/news/${recommendedNews.newsId}?src=rec|}） -->
            <a class="rec-link" th:href="@{|/news/${recommendedNews.newsId}?src=rec|}" th:text="${recDisplayTitle}"></a>
            <!-- 推薦値を表示 -->
            <div class="rec-score" th:text="${'推薦値：' + recommendedNews.scoreText()}">推薦値：0.0000</div>

            <!-- 推薦値詳細を折りたたみ表示 -->
            <details class="rec-detail-section">
              <!-- 推薦値詳細の開閉ラベル -->
              <summary>[推薦値詳細を表示]</summary>
              <!-- 推薦値詳細の本文 -->
              <pre class="rec-detail" th:text="${recommendedNews.recommendationDetailText()}">▼ 推薦値の計算</pre>
            </details>

            <!-- 基本評価詳細を折りたたみ表示 -->
            <details class="rec-detail-section">
              <!-- 基本評価詳細の開閉ラベル -->
              <summary>[基本評価詳細を表示]</summary>
              <!-- 基本評価詳細の本文 -->
              <pre class="rec-detail" th:text="${recommendedNews.baseScoreDetailText()}">▼ 基本評価の計算</pre>
            </details>

            <!-- 学習モデル評価詳細を折りたたみ表示 -->
            <details class="rec-detail-section">
              <!-- 学習モデル評価詳細の開閉ラベル -->
              <summary>[学習モデル評価詳細を表示]</summary>
              <!-- 学習モデル評価詳細の本文 -->
              <pre class="rec-detail" th:text="${recommendedNews.modelScoreDetailText()}">▼ 学習モデル評価の計算</pre>
            </details>

            <!-- 調整値詳細を折りたたみ表示 -->
            <details class="rec-detail-section">
              <!-- 調整値詳細の開閉ラベル -->
              <summary>[調整値詳細を表示]</summary>
              <!-- 調整値詳細の本文 -->
              <pre class="rec-detail" th:text="${recommendedNews.adjustmentDetailText()}">▼ 調整値の計算</pre>
            </details>



          </li>

        </ul>
      </aside>
    </div>

  </body>
</html>
